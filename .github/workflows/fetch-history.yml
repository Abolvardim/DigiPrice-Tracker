name: Fetch Digikala product history
run-name: DigiPrice ${{ inputs.product_id }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      product_id:
        description: Digikala product ID
        required: true
        type: string
      request_id:
        description: Unique request identifier
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: digiprice-history-cache
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fetch dependency
        run: python -m pip install --disable-pip-version-check "curl_cffi>=0.7,<1"
      - name: Fetch history
        env:
          PRODUCT_ID: ${{ inputs.product_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/fetch_history.py
      - name: Commit history cache
        env:
          PRODUCT_ID: ${{ inputs.product_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/history/${PRODUCT_ID}.json"
          git commit -m "Update price history for ${PRODUCT_ID} (${REQUEST_ID})"
          git push
