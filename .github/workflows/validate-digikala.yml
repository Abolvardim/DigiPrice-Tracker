name: Validate Digikala price-history access

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight HTTP client
        run: python -m pip install --disable-pip-version-check "curl-cffi>=0.16.3"
      - name: Probe public price-history endpoint
        run: python scripts/validate_upstream.py
      - name: Upload validation results
        if: always() && hashFiles('validation-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digikala-price-history-validation
          path: validation-results.json
          retention-days: 14
